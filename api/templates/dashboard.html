<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - BRIN SHELL</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-white min-h-screen p-8">

    <div class="max-w-4xl mx-auto">
        <header class="flex justify-between items-center mb-10 border-b border-gray-800 pb-4">
            <h1 class="text-3xl font-bold text-indigo-400">BRIN SHELL <span class="text-white text-xl">{{ plan.title() }} Portal</span></h1>
            <a href="/logout" class="text-red-400 hover:text-red-300">Logout</a>
        </header>

        <!-- Video Section (Example of 1 by 1 unlock) -->
        <div class="bg-gray-900 rounded-2xl p-6 border border-gray-800 mb-8">
            <h2 class="text-2xl font-bold mb-4">Module {{ current_video }}: Getting Started</h2>
            
            <div class="aspect-video bg-black rounded-xl flex items-center justify-center mb-6 border border-gray-700">
                <p class="text-gray-500">Video Player Placeholder for Video {{ current_video }}</p>
            </div>

            <div class="flex justify-end">
                <button class="bg-indigo-600 hover:bg-indigo-700 px-6 py-2 rounded font-bold transition">Complete & Next Video</button>
            </div>
        </div>

        <!-- Feedback Section -->
        <div class="bg-gray-900 rounded-2xl p-6 border border-gray-800">
            <h3 class="text-xl font-bold mb-4">Share your feedback</h3>
            <textarea class="w-full bg-gray-800 border border-gray-700 rounded-xl p-4 text-white focus:outline-none focus:border-indigo-500 mb-4 h-24" placeholder="What did you learn? Any doubts?"></textarea>
            <button class="bg-purple-600 hover:bg-purple-700 px-6 py-2 rounded font-bold transition">Submit Feedback</button>
        </div>
    </div>

</body>
</html>
