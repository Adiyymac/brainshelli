<!-- DESKTOP: Floating Dynamic Island Top Bar -->
<nav class="hidden md:flex dynamic-nav fixed top-6 left-1/2 transform -translate-x-1/2 w-fit min-w-[650px] glass-panel rounded-full px-8 py-4 justify-between items-center z-50 shadow-[0_20px_50px_-12px_rgba(79,70,229,0.6)] border border-indigo-400/40">
    <div class="flex items-center gap-6">
        <h1 class="text-xl font-black tracking-widest bg-clip-text text-transparent bg-gradient-to-r from-indigo-400 to-purple-400">BRIN SHELL</h1>
        {% if user and user.plan != 'none' %}
            <span class="bg-indigo-900/50 text-indigo-300 px-3 py-1 rounded-full text-[10px] font-bold border border-indigo-500/50 uppercase tracking-widest shadow-inner">{{ user.plan }} BATCH</span>
        {% endif %}
    </div>
    
    <div class="flex items-center gap-8">
        <a href="/dashboard" class="text-sm font-bold {% if '/profile' not in request.path %}text-white drop-shadow-[0_0_10px_rgba(129,140,248,0.9)]{% else %}text-gray-300 hover:text-white hover:drop-shadow-[0_0_10px_rgba(129,140,248,0.9)]{% endif %} transition-all">Dashboard</a>
        <a href="/profile" class="text-sm font-bold {% if '/profile' in request.path %}text-white drop-shadow-[0_0_10px_rgba(129,140,248,0.9)]{% else %}text-gray-300 hover:text-white hover:drop-shadow-[0_0_10px_rgba(129,140,248,0.9)]{% endif %} transition-all">My Profile</a>
        <div class="w-px h-5 bg-gray-700"></div>
        <a href="/logout" class="text-sm font-bold text-red-400 hover:text-red-300 hover:drop-shadow-[0_0_10px_rgba(248,113,113,0.9)] transition-all">Logout</a>
    </div>
</nav>

<!-- MOBILE: Simple Top Header -->
<div class="md:hidden flex justify-between items-center p-5 w-full bg-gray-950/80 backdrop-blur-md fixed top-0 z-40 border-b border-gray-800/50">
    <h1 class="text-xl font-extrabold bg-clip-text text-transparent bg-gradient-to-r from-indigo-400 to-purple-500">BRIN SHELL</h1>
    <span class="bg-indigo-600/20 text-indigo-400 px-3 py-1 rounded-full text-[10px] font-bold border border-indigo-500/30 uppercase">
        {% if '/profile' in request.path %}SETTINGS{% else %}{{ user.plan if user else 'PORTAL' }}{% endif %}
    </span>
</div>

<!-- MOBILE: Bottom Floating Navigation -->
<div class="md:hidden fixed bottom-6 left-1/2 transform -translate-x-1/2 w-[90%] max-w-[350px] glass-panel rounded-full px-6 py-3.5 flex justify-between items-center z-50 shadow-[0_10px_40px_rgba(0,0,0,0.8)] border border-indigo-500/40 backdrop-blur-xl">
    <a href="/dashboard" class="nav-icon {% if '/profile' not in request.path %}text-indigo-400{% else %}text-gray-400 hover:text-indigo-400{% endif %} transition flex flex-col items-center gap-1">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
        <span class="text-[9px] font-bold tracking-wider">HOME</span>
    </a>
    <a href="{% if '/profile' in request.path %}/dashboard#course-modules{% else %}#course-modules{% endif %}" class="nav-icon text-gray-400 hover:text-indigo-400 transition flex flex-col items-center gap-1">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
        <span class="text-[9px] font-bold tracking-wider">MODULES</span>
    </a>
    <a href="/profile" class="nav-icon {% if '/profile' in request.path %}text-indigo-400{% else %}text-gray-400 hover:text-indigo-400{% endif %} transition flex flex-col items-center gap-1">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
        <span class="text-[9px] font-bold tracking-wider">PROFILE</span>
    </a>
    <a href="/logout" class="nav-icon text-gray-400 hover:text-red-400 transition flex flex-col items-center gap-1">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
        <span class="text-[9px] font-bold tracking-wider">LOGOUT</span>
    </a>
</div>
