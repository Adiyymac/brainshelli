<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - BRIN SHELL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .glass-panel { background: rgba(17, 24, 39, 0.7); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body class="bg-gray-950 text-white font-sans min-h-screen flex items-center justify-center p-4">
    
    {% include 'preloader.html' %}
    
    <div class="glass-panel p-8 sm:p-10 rounded-3xl w-full max-w-md border border-gray-800 shadow-2xl relative overflow-hidden">
        <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-indigo-500 to-purple-500"></div>
        
        <div class="text-center mb-8">
            <h2 class="text-3xl font-extrabold bg-clip-text text-transparent bg-gradient-to-r from-indigo-400 to-purple-500 mb-2">BRIN SHELL</h2>
            <h3 class="text-xl font-bold text-white mb-2">Forgot Password?</h3>
            <p class="text-sm text-gray-400">Enter your email address and we'll send you an OTP to reset your password.</p>
        </div>
        
        <form method="POST" class="space-y-6">
            <div>
                <label class="block text-gray-400 text-xs font-semibold mb-2 uppercase tracking-wider pl-1">Registered Email</label>
                <input type="email" name="email" required placeholder="example@email.com" class="w-full p-4 rounded-2xl bg-gray-900/50 border border-gray-700/50 text-white focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition shadow-inner">
            </div>
            
            <button type="submit" class="w-full bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white p-4 rounded-2xl font-bold tracking-wider uppercase text-sm shadow-[0_0_20px_rgba(79,70,229,0.4)] transition transform hover:-translate-y-1">
                Send OTP
            </button>
            
            <div class="text-center mt-6">
                <a href="/login" class="text-indigo-400 hover:text-indigo-300 text-sm font-semibold transition">← Back to Login</a>
            </div>
        </form>
    </div>
</body>
</html>
