<style>
    /* Preloader Fade Out Animation */
    .preloader-fade-out { 
        opacity: 0; 
        visibility: hidden; 
        transition: opacity 0.8s ease-out, visibility 0.8s ease-out; 
    }

    /* Outline Text Animation */
    .text-outline {
        fill: transparent;
        stroke-width: 2.5px;
        stroke-dasharray: 40 20;
        animation: dashMove 2s linear infinite;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 900;
    }

    /* Colors matching the image */
    .stroke-brain { stroke: #14b8a6; } /* Teal color for 'brain' */
    .stroke-white { stroke: #ffffff; } /* White color for 'Sh' and 'll' */
    .stroke-yellow { stroke: #fbbf24; } /* Yellow color for 'e' */

    @keyframes dashMove {
        0% { stroke-dashoffset: 120; }
        100% { stroke-dashoffset: 0; }
    }
</style>

<!-- PRELOADER (Loading Screen) -->
<div id="brin-preloader" class="fixed inset-0 z-[100] bg-gray-950 flex flex-col items-center justify-center">
    
    <!-- SVG Animated Text -->
    <svg width="300" height="150" viewBox="0 0 300 150" class="overflow-visible">
        
        <!-- First Line: brain -->
        <text x="50%" y="60" text-anchor="middle" font-size="55" class="text-outline stroke-brain" letter-spacing="1">
            brain
        </text>
        
        <!-- Second Line: Shell -->
        <text x="50%" y="120" text-anchor="middle" font-size="55" class="text-outline" letter-spacing="1">
            <tspan class="stroke-white">Sh</tspan><tspan class="stroke-yellow">e</tspan><tspan class="stroke-white">ll</tspan>
        </text>
        
    </svg>
    
</div>

<!-- PRELOADER SCRIPT -->
<script>
    window.addEventListener('load', function() {
        const preloader = document.getElementById('brin-preloader');
        if(preloader){
            preloader.classList.add('preloader-fade-out');
            setTimeout(() => { preloader.style.display = 'none'; }, 800);
        }
    });
</script>
