<style>

    body {
        background-color: #021a18;

        overflow-x: hidden;
    }
    
    /* Unified Glass Panel Design for all pages */
    .glass-panel, .card-glass {
        background: linear-gradient(145deg, rgba(11, 94, 90, 0.3) 0%, rgba(2, 26, 24, 0.7) 100%);
        border: 1px solid rgba(20, 184, 166, 0.2);
        backdrop-filter: blur(16px);

    .text-glow {
        text-shadow: 0 0 30px rgba(20, 184, 166, 0.5);
    }

    /* Scrollbar Design */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #011413; }
    ::-webkit-scrollbar-thumb { background: #0d9488; border-radius: 10px; }
    .custom-scrollbar::-webkit-scrollbar { width: 4px; }
    
    /* Animations */
    .nav-icon:active { transform: scale(0.9); }
    .dynamic-nav { animation: slideDown 0.6s cubic-bezier(0.16, 1, 0.3, 1); }
    @keyframes slideDown { 
        from { transform: translate(-50%, -100%); opacity: 0; } 
        to { transform: translate(-50%, 0); opacity: 1; }
