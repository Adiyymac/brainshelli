<!DOCTYPE html>
<html lang="en">
<head>
    <title>Login - BRIN SHELL</title>
    {% include 'meta.html' %}
</head>
<body class="text-gray-200 antialiased selection:bg-teal-600 selection:text-white min-h-screen flex items-center justify-center p-4 relative">
    
    {% include 'preloader.html' %}
    
    <!-- Background Glow -->
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[500px] bg-teal-900/20 rounded-full blur-[100px] pointer-events-none"></div>

    <div class="glass-panel p-8 sm:p-10 rounded-3xl w-full max-w-md shadow-2xl relative overflow-hidden z-10">
        <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-teal-500 to-emerald-500"></div>
        
        <div class="text-center mb-8">
            <h2 class="text-3xl font-extrabold bg-clip-text text-transparent bg-gradient-to-r from-teal-400 to-emerald-400 mb-2">BRIN SHELL</h2>
            <p class="text-sm text-gray-400">Welcome back! Please login to your account.</p>
        </div>
        
        <form method="POST" class="space-y-5">
            <div>
                <label class="block text-gray-400 text-xs font-semibold mb-2 uppercase tracking-wider pl-1">Email Address</label>
                <input type="email" name="email" required class="w-full p-4 rounded-2xl bg-teal-950/30 border border-teal-800/50 text-white focus:outline-none focus:border-teal-500 focus:ring-1 focus:ring-teal-500 transition shadow-inner">
            </div>
            <div>
                <label class="block text-gray-400 text-xs font-semibold mb-2 uppercase tracking-wider pl-1">Password</label>
                <input type="password" name="password" required class="w-full p-4 rounded-2xl bg-teal-950/30 border border-teal-800/50 text-white focus:outline-none focus:border-teal-500 focus:ring-1 focus:ring-teal-500 transition shadow-inner">
            </div>
            
            <div class="text-right mb-2">
                <a href="/forgot-password" class="text-xs font-semibold text-teal-400 hover:text-teal-300 transition">Forgot Password?</a>
            </div>
            
            <button type="submit" class="w-full bg-gradient-to-r from-teal-600 to-emerald-600 hover:from-teal-500 hover:to-emerald-500 text-white p-4 rounded-2xl font-bold tracking-wider uppercase text-sm shadow-[0_0_20px_rgba(20,184,166,0.4)] transition transform hover:-translate-y-1">
                Secure Login
            </button>
        </form>

        <!-- Divider -->
        <div class="mt-8 mb-6 relative">
            <div class="absolute inset-0 flex items-center">
                <div class="w-full border-t border-teal-800/50"></div>
            </div>
            <div class="relative flex justify-center text-sm">
                <span class="px-4 bg-[#021a18] text-teal-600/80 text-xs font-bold uppercase tracking-widest">Or continue with</span>
            </div>
        </div>

        <!-- Google Login Button -->
        <div>
            <!-- നിങ്ങളൂടെ പൈത്തൺ കോഡിലുള്ള ഗൂഗിൾ ലോഗിൻ റൂട്ട് (ഉദാഹരണത്തിന് '/login/google') താഴെ href-ൽ കൊടുക്കുക -->
            <a href="/login/google" class="w-full flex items-center justify-center px-4 py-3.5 border border-teal-800/50 rounded-2xl shadow-sm bg-teal-950/30 text-sm font-bold text-gray-300 hover:bg-teal-900/50 hover:border-teal-500/50 hover:text-white transition group">
                <svg class="h-5 w-5 mr-3 group-hover:scale-110 transition-transform" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                    <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                    <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                    <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                </svg>
                Sign in with Google
            </a>
        </div>
        
    </div>
</body>
</html>
