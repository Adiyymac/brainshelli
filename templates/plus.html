<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PRO Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-white p-8">
    <div class="max-w-5xl mx-auto">
        <div class="flex justify-between items-center border-b border-gray-800 pb-4 mb-8">
            <h1 class="text-3xl font-bold text-indigo-400">PRO Portal</h1>
            <a href="/logout" class="bg-red-600 px-4 py-2 rounded font-bold">Logout</a>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            {% for video in videos %}
            <div class="bg-gray-900 p-4 rounded-xl border border-gray-800">
                <h3 class="text-xl font-bold mb-4">{{ video.title }}</h3>
                <div class="aspect-video bg-black rounded-lg overflow-hidden">
                    <iframe src="{{ video.video_url }}" class="w-full h-full" frameborder="0" allowfullscreen></iframe>
                </div>
            </div>
            {% else %}
            <p class="text-gray-500">No videos uploaded for Pro plan yet.</p>
            {% endfor %}
        </div>
    </div>
</body>
</html>
