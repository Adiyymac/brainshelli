<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Secure Checkout - BRIN SHELL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #021a18; }
        .glass-box { background: rgba(11, 94, 90, 0.2); backdrop-filter: blur(14px); border: 1px solid rgba(20, 184, 166, 0.18); }
    </style>
</head>
<body class="text-white h-screen flex flex-col items-center justify-center p-4">

    <div class="glass-box p-8 rounded-3xl w-full max-w-md text-center shadow-2xl">
        <h2 class="text-2xl font-bold text-teal-400 mb-2">Complete Your Payment</h2>
        <p class="text-gray-300 text-sm mb-6">You are upgrading to the <span class="font-bold text-yellow-400">{{ plan.upper() }}</span> plan.</p>
        
        <div class="bg-teal-950/50 border border-teal-800 p-6 rounded-2xl mb-8">
            <p class="text-gray-400 text-xs uppercase tracking-widest mb-1">Total Amount</p>
            <h1 class="text-5xl font-black text-white">₹{{ order.amount / 100 }}</h1>
        </div>
        
        <button id="pay-btn" class="w-full bg-gradient-to-r from-teal-500 to-emerald-500 hover:from-teal-400 hover:to-emerald-400 text-teal-950 p-4 rounded-xl font-bold text-lg transition shadow-[0_0_20px_rgba(20,184,166,0.4)]">
            Pay Now Securely
        </button>
        
        <p class="text-[10px] text-gray-500 mt-4 flex items-center justify-center gap-1">
            <svg class="w-3 h-3" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z" clip-rule="evenodd"></path></svg>
            Secured by Razorpay
        </p>
    </div>

    <!-- Form to submit after successful payment -->
    <form id="payment-form" action="/payment_success" method="POST" class="hidden">
        <input type="hidden" name="plan" value="{{ plan }}">
        <input type="hidden" name="razorpay_payment_id" id="razorpay_payment_id">
        <input type="hidden" name="razorpay_order_id" id="razorpay_order_id">
        <input type="hidden" name="razorpay_signature" id="razorpay_signature">
    </form>

    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <!-- Razorpay Script തൽക്കാലം മാറ്റി ഡമ്മി സബ്മിറ്റ് നൽകുന്നു -->
    <script>
        document.getElementById('pay-btn').onclick = function(e){
            e.preventDefault();
            
            // Pay Now ക്ലിക്ക് ചെയ്യുമ്പോൾ നേരെ Success പേജിലേക്ക് പോകും
            document.getElementById('pay-btn').innerText = "Processing...";
            setTimeout(function() {
                document.getElementById('payment-form').submit();
            }, 1000); // 1 സെക്കൻഡ് ഡിലേ നൽകി സബ്മിറ്റ് ആകുന്നു
        }
    </script>
</body>
</html>
